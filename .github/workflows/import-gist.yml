name: Import gist as post

on:
  workflow_dispatch:
    inputs:
      gist:
        description: Gist URL or ID
        required: true
        type: string
      filename:
        description: Markdown filename for a multi-file gist
        required: false
        type: string
      slug:
        description: Post slug (defaults to the gist filename)
        required: false
        type: string
      title:
        description: Title override (defaults to the first H1)
        required: false
        type: string
      description:
        description: Description override (defaults to the first paragraph)
        required: false
        type: string
      date:
        description: Publication date override
        required: false
        type: string
      tags:
        description: Comma-separated tags
        required: false
        default: blog-post,gist
        type: string
      kind:
        description: Post kind
        required: false
        default: blog
        type: choice
        options:
          - blog
          - stream
  workflow_call:
    inputs:
      gist:
        required: true
        type: string
      filename:
        required: false
        type: string
      slug:
        required: false
        type: string
      title:
        required: false
        type: string
      description:
        required: false
        type: string
      date:
        required: false
        type: string
      tags:
        required: false
        default: blog-post,gist
        type: string
      kind:
        required: false
        default: blog
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Import gist
        env:
          GIST: ${{ inputs.gist }}
          FILENAME: ${{ inputs.filename }}
          SLUG: ${{ inputs.slug }}
          TITLE: ${{ inputs.title }}
          DESCRIPTION: ${{ inputs.description }}
          DATE: ${{ inputs.date }}
          TAGS: ${{ inputs.tags }}
          KIND: ${{ inputs.kind }}
        run: |
          args=("$GIST" --tags "$TAGS" --kind "$KIND")
          [ -z "$FILENAME" ] || args+=(--filename "$FILENAME")
          [ -z "$SLUG" ] || args+=(--slug "$SLUG")
          [ -z "$TITLE" ] || args+=(--title "$TITLE")
          [ -z "$DESCRIPTION" ] || args+=(--description "$DESCRIPTION")
          [ -z "$DATE" ] || args+=(--date "$DATE")
          npm run import:gist -- "${args[@]}"

      - name: Validate site
        run: |
          npm ci
          npm run build

      - name: Open content pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GIST: ${{ inputs.gist }}
        run: |
          if [ -z "$(git status --porcelain -- src/content/posts)" ]; then
            echo "The imported gist already matches the repository."
            exit 0
          fi

          branch="content/import-gist-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add src/content/posts
          git commit -m "Import gist as blog post"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$branch" \
            --title "Import gist as blog post" \
            --body "Imports ${GIST} into the canonical Astro posts collection."
