- title: Research Assistant
  date: 2020 - 2024
  organization: Iowa State University, Program Analysis Lab
  location: Ames, IA
  text: |
    <ul>
    <li>Achieved state-of-the-art Big-Vul vulnerability detection performance (96.46 F1) by combining a dataflow-inspired graph model with an LLM; the graph model trained in 9 minutes—75x faster than the strongest baseline—and detected 8.7 of 17 real-world vulnerabilities where baselines found none. <a href="/publication/2024-04-14-deepdfa">"Dataflow Analysis-Inspired Deep Learning for Efficient Vulnerability Detection", ICSE 2024</a> (<a href="https://github.com/ISU-PAAL/DeepDFA">code</a>; 22% acceptance rate).</li>
    <li>Built a <a href="https://github.com/ARiSE-Lab/TRACED_ICSE_24/tree/main/tracer">C/C++ execution tracing engine</a> from scratch for <a href="/publication/2024-04-14-traced">"TRACED: Execution-aware Pre-training for Source Code", ICSE 2024</a> (<a href="https://github.com/ARiSE-Lab/TRACED_ICSE_24">code</a>; 22% acceptance rate), enabling execution-aware pre-training that improved complete path prediction by 12.4% and runtime value prediction by 25.2%; the Java variant of the engine was later used in <a href="/publication/codesense">"CodeSense", ICLR 2026</a>.</li>
    <li>Conducted an empirical study of 9 state-of-the-art vulnerability detection models across 2 datasets, examining model capabilities, training data, and model interpretation; found substantial run-to-run variance and low agreement among model outputs. <a href="/publication/2023-05-14-empirical">"An Empirical Study of Deep Learning Models for Vulnerability Detection", ICSE 2023</a> (<a href="https://github.com/ISU-PAAL/DL-VD-Empirical-Study">code</a>; 26% acceptance rate).</li>
    <li>Collaborated with ARiSE lab at Columbia University and CERT lab @ Carnegie-Mellon University.</li>
    <li>Improved experiment iteration time by building tools for static analysis (<a href="https://github.com/bstee615/tree-climber">tree-climber</a>) and dynamic analysis and code generation (<a href="https://github.com/bstee615/pal-tools">pal-tools</a>).</li>
    <li>Enabled collaboration on experiments by acquiring and maintaining bug benchmarks for use in experiments.</li>
    </ul>

